spring.application.name=instituicoes
server.port=8080

# Banco de dados MySQL (rode antes o script database/estrutura_vittas.sql)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vittas_db?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# O schema e criado pelo script SQL; o Hibernate apenas valida o mapeamento.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Origens liberadas para o frontend (separadas por virgula)
vittas.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:5173}
